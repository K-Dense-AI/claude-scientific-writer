name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no long-lived token anywhere.
# One-time setup on pypi.org: project "scientific-writer" → Settings → Publishing →
# add GitHub publisher (owner K-Dense-AI, repo claude-scientific-writer,
# workflow release.yml, environment pypi).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Verify and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # contents: write is needed only by the final step, which creates the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --frozen --group dev
      - name: Tag matches package version
        run: |
          python - <<'EOF'
          import os, re, sys
          text = open("pyproject.toml").read()
          version = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject version {version}")
          print(f"tag matches version {version}")
          EOF
      - name: Changelog documents this version
        # Extracted up front so a missing changelog entry fails before anything
        # is published, rather than after the release is already on PyPI.
        run: >-
          uv run --frozen python scripts/changelog_notes.py "${GITHUB_REF_NAME#v}"
          --output release-notes.md --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest
        run: uv run --frozen pytest tests/ -q
      - name: Codespell
        run: >-
          uv run --frozen codespell README.md CHANGELOG.md CONTRIBUTING.md
          example_api_usage.py CLAUDE.md AGENTS.md pyproject.toml
          .env.example scientific_writer scripts tests docs commands templates .github
      - name: Skill mirrors in sync
        run: uv run --frozen python scripts/sync_skills.py --check
      - name: Repository consistency
        run: uv run --frozen python scripts/check_consistency.py
      - name: Package verification
        run: uv run --frozen python scripts/verify_package.py
      - name: Build
        run: uv build
      - name: Wheel ships the .claude payload
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from publish import verify_wheel_payload
          verify_wheel_payload(Path("dist"))
          EOF
      - name: Publish (trusted publishing)
        run: uv publish --trusted-publishing always
      - name: Create GitHub release
        # Runs only after PyPI publishing succeeds, so the releases page never
        # advertises a version that is not installable. Idempotent so a re-run
        # of the same tag refreshes the notes instead of failing.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
              --latest --draft=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
              --latest --verify-tag
          fi
          gh release view "$TAG" --json tagName,isDraft,url
